<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus DM</title>
  <style>
    :root {
      --bg: #111216;
      --card-bg: #1a1c23;
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --primary: #2b7de9;
      --primary-hover: #1a63c4;
      --border: rgba(255, 255, 255, 0.1);
      --success: #34d399;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: var(--bg); color: var(--text); padding: 14px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon { font-size: 18px; }
    .brand-name { font-size: 15px; font-weight: 700; }
    .brand-version { font-size: 10px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: var(--text-dim); }

    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; display: flex; align-items: center; gap: 4px; font-weight: 600; }
    .status-online { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .status-offline { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }

    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin: 12px 0 6px; letter-spacing: 0.5px; }

    .media-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .media-empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 12px 0; }
    .media-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .media-item:last-child { border-bottom: none; }
    .media-title { font-size: 12px; font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-download-sm { background: var(--primary); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-download-sm:hover { background: var(--primary-hover); }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
    .toggle-label { font-size: 12px; color: var(--text); }

    /* Switch */
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 18px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(16px); }

    .quick-input { display: flex; gap: 6px; margin-top: 6px; }
    .input-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: white; padding: 6px 10px; font-size: 12px; outline: none; }
    .input-box:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">Nexus DM</span>
      <span class="brand-version">v1.0</span>
    </div>
    <div id="status-chip" class="status-badge status-offline">● Offline</div>
  </div>

  <div class="section-title">Detected Media on Page</div>
  <div class="media-card" id="media-list">
    <div class="media-empty">No video streams detected yet</div>
  </div>

  <div class="section-title">Quick Download</div>
  <div class="quick-input">
    <input type="text" id="manual-url" class="input-box" placeholder="Paste URL here...">
    <button type="button" id="btn-quick-download" class="btn-download-sm">Send</button>
  </div>

  <div class="section-title">Preferences</div>
  <div class="media-card">
    <div class="toggle-row">
      <span class="toggle-label">Auto-Intercept Downloads</span>
      <label class="switch">
        <input type="checkbox" id="toggle-intercept" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Floating Video Button</span>
      <label class="switch">
        <input type="checkbox" id="toggle-float" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
